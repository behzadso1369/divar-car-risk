<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ریسک‌سنج خودرو{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #667085; --line: #e4e7ec;
  --accent: #1f6feb; --accent-soft: #e8f0fe;
  --low: #12855b; --low-soft: #e3f5ec; --med: #b26a00; --med-soft: #fff3dc;
  --high: #c62f2f; --high-soft: #fde7e7; --pos: #12855b; --info: #667085;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --card: #171b23; --text: #e6e9ef; --muted: #98a2b3; --line: #2a303b;
    --accent: #5b9bff; --accent-soft: #1a2a45;
    --low: #3ccf8e; --low-soft: #13291f; --med: #f5b544; --med-soft: #2e2412;
    --high: #ff6b6b; --high-soft: #331717; --pos: #3ccf8e; --info: #98a2b3;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --card: #171b23; --text: #e6e9ef; --muted: #98a2b3; --line: #2a303b;
  --accent: #5b9bff; --accent-soft: #1a2a45;
  --low: #3ccf8e; --low-soft: #13291f; --med: #f5b544; --med-soft: #2e2412;
  --high: #ff6b6b; --high-soft: #331717; --pos: #3ccf8e; --info: #98a2b3; --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font-family: "Vazirmatn", Tahoma, sans-serif; font-size: 15px; line-height: 1.8; }
.wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
header.top a { color: var(--text); text-decoration: none; font-weight: 800; font-size: 18px; }
header.top nav a { font-weight: 500; font-size: 14px; color: var(--muted); margin-inline-start: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px;
  box-shadow: var(--shadow); margin-bottom: 16px; }
h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 17px; margin: 0 0 12px; }
h3 { font-size: 15px; margin: 16px 0 8px; }
.muted { color: var(--muted); } .small { font-size: 13px; }
label { display: block; font-weight: 500; margin-bottom: 4px; font-size: 14px; }
input[type=text], input[type=number], input[type=url], select, textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); color: var(--text); font: inherit; }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line);
  border-radius: 999px; font-size: 14px; cursor: pointer; background: var(--bg); }
.chip input { accent-color: var(--accent); }
button, .btn { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 12px 22px;
  font: inherit; font-weight: 700; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
.error { background: var(--high-soft); color: var(--high); padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; }
.ok { background: var(--low-soft); color: var(--low); padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td, th { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: top; }
th { color: var(--muted); font-weight: 500; }
.ltr { direction: ltr; unicode-bidi: embed; }
@media (max-width: 600px) { .wrap { padding: 16px 16px 48px; } h1 { font-size: 19px; } }
{% block style %}{% endblock %}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a href="/">🚗 ریسک‌سنج آگهی خودرو</a>
    {% if not standalone %}<nav><a href="/">تحلیل جدید</a><a href="/history">تاریخچه</a><a href="/insights">آمار ادعاها</a></nav>{% endif %}
  </header>
  {% block content %}{% endblock %}
</div>
</body>
</html>
